<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimulacionEcoWeb · Simulaciones económicas interactivas</title>
<meta name="description" content="SimulacionEcoWeb: laboratorio virtual con 8 simulaciones económicas interactivas: mercados, finanzas, inventarios, cadena de suministro y colas.">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="vendor/katex-0.19.1/katex.min.css">
<script defer src="vendor/chart-4.5.1.umd.min.js"></script>
<script defer src="vendor/katex-0.19.1/katex.min.js"></script>
<script type="module" src="js/app.js"></script>
<script defer src="vendor/alpine-3.17.5.min.js"></script>
</head>
<body>
<a class="skip-link" href="#view">Saltar al contenido</a>

<header class="app-header" x-data>
  <a class="brand" href="#/" aria-label="SimulacionEcoWeb, ir al inicio">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1D4ED8"></rect><path d="M7 22 L13 15 L18 19 L25 9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="25" cy="9" r="2.5" fill="#FDBA74"></circle></svg>
    <span class="brand-name">SimulacionEcoWeb</span>
  </a>
  <code class="route-chip" x-show="$store.app.route" x-text="'#/' + $store.app.route" x-cloak></code>
  <span class="tagline" x-show="!$store.app.route">Simulaciones económicas interactivas</span>
  <div class="header-spacer"></div>
  <template x-if="$store.app.route">
    <div style="display:contents">
      <label class="seed-field">Semilla
        <input type="number" min="1" step="1" inputmode="numeric" :value="$store.app.seed" @change="$store.app.setSeed($event.target.value); $event.target.value = $store.app.seed" :disabled="$store.app.running">
      </label>
      <div class="hdr-actions">
        <button class="btn btn-ghost-dark" type="button" @click="$store.app.saveScenario()">Guardar escenario</button>
        <button class="btn btn-light" type="button" @click="$store.app.copyLink()">Copiar enlace</button>
      </div>
    </div>
  </template>
  <div class="mobile-nav">
    <label for="nav-sel" class="sr-only">Ir a la simulación</label>
    <select id="nav-sel" :value="$store.app.route" @change="$store.app.go($event.target.value)">
      <option value="">Inicio</option>
      <option value="oferta-demanda">01 · Oferta y demanda</option>
      <option value="interes-compuesto">02 · Interés compuesto</option>
      <option value="eoq">03 · Cantidad económica de pedido</option>
      <option value="punto-reorden">04 · Punto de reorden</option>
      <option value="sistemas-revision">05 · Sistemas de revisión</option>
      <option value="efecto-latigo">06 · Efecto látigo</option>
      <option value="beer-game">07 · Beer Game</option>
      <option value="colas">08 · Colas y cuellos de botella</option>
    </select>
  </div>
</header>

<div class="shell">
  <nav class="sidenav" aria-label="Simulaciones" x-data>
    <span class="nav-title">Secciones</span>
    <button class="nav-toggle" type="button" :aria-expanded="$store.app.navOpen ? 'true' : 'false'" aria-controls="nav-list" @click="$store.app.navOpen = !$store.app.navOpen">Secciones</button>
    <ul class="nav-list" id="nav-list" :class="{ open: $store.app.navOpen }">
      <li><a class="navlink" href="#/" :aria-current="$store.app.route === '' ? 'page' : null">Inicio</a></li>
      <li><a class="navlink" href="#/oferta-demanda" :aria-current="$store.app.route === 'oferta-demanda' ? 'page' : null"><span class="n">01</span>Oferta y demanda</a></li>
      <li><a class="navlink" href="#/interes-compuesto" :aria-current="$store.app.route === 'interes-compuesto' ? 'page' : null"><span class="n">02</span>Interés compuesto</a></li>
      <li><a class="navlink" href="#/eoq" :aria-current="$store.app.route === 'eoq' ? 'page' : null"><span class="n">03</span>Cantidad económica de pedido</a></li>
      <li><a class="navlink" href="#/punto-reorden" :aria-current="$store.app.route === 'punto-reorden' ? 'page' : null"><span class="n">04</span>Punto de reorden</a></li>
      <li><a class="navlink" href="#/sistemas-revision" :aria-current="$store.app.route === 'sistemas-revision' ? 'page' : null"><span class="n">05</span>Sistemas de revisión</a></li>
      <li><a class="navlink" href="#/efecto-latigo" :aria-current="$store.app.route === 'efecto-latigo' ? 'page' : null"><span class="n">06</span>Efecto látigo</a></li>
      <li><a class="navlink" href="#/beer-game" :aria-current="$store.app.route === 'beer-game' ? 'page' : null"><span class="n">07</span>Beer Game</a></li>
      <li><a class="navlink" href="#/colas" :aria-current="$store.app.route === 'colas' ? 'page' : null"><span class="n">08</span>Colas y cuellos de botella</a></li>
    </ul>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>

<div class="mobile-actions" x-data x-show="$store.app.route" x-cloak>
  <label class="seed-field">Semilla
    <input type="number" min="1" step="1" inputmode="numeric" :value="$store.app.seed" @change="$store.app.setSeed($event.target.value); $event.target.value = $store.app.seed" :disabled="$store.app.running">
  </label>
  <button class="btn" type="button" @click="$store.app.saveScenario()">Guardar</button>
  <button class="btn btn-primary" type="button" @click="$store.app.copyLink()">Copiar enlace</button>
</div>

<div x-data>
  <div class="toast" x-show="$store.app.toast" x-text="$store.app.toast" aria-hidden="true" x-cloak></div>
  <div class="sr-only" role="status" aria-live="polite" x-text="$store.app.toast"></div>
</div>

<noscript><p style="padding:24px">SimulacionEcoWeb necesita JavaScript para ejecutar las simulaciones.</p></noscript>
</body>
</html>
